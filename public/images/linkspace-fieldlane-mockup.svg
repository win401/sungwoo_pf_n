    <rect x="939" y="273" width="174" height="37" rx="18" fill="#e7eefb"/>
    <text x="1026" y="298" font-size="16" font-weight="700" fill="#304d86" text-anchor="middle">예시 · 가상 데이터</text>
    <path d="M97 330h1060" stroke="#e1e9f4"/>
    <text x="135" y="374" font-size="18" font-weight="700" fill="#3a60ac">현황 지도</text>
    <text x="254" y="374" font-size="18" fill="#526481">요구사항</text>
    <text x="373" y="374" font-size="18" fill="#526481">GitHub 현황</text>
    <text x="525" y="374" font-size="18" fill="#526481">GCP 현황</text>
    <path d="M135 392h75" stroke="#527bd0" stroke-width="4" stroke-linecap="round"/>
    <text x="135" y="452" font-size="36" font-weight="700" fill="#172747">개발 현황 지도</text>
    <text x="135" y="488" font-size="18" fill="#526481">코드 변경과 검사, 배포 상태를 읽기 전용으로 살펴보는 화면</text>
    <rect x="135" y="532" width="976" height="326" rx="17" fill="#eef4fb" stroke="#d4dfef"/>
    <rect x="135" y="532" width="976" height="326" rx="17" fill="url(#dots)"/>
    <path d="M446 690h70m247 0h68" stroke="#7993bb" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="m508 684 8 6-8 6m315-12 8 6-8 6" fill="none" stroke="#7993bb" stroke-width="3"/>
    <g fill="#fff" stroke="#d0def1">
      <rect x="181" y="623" width="265" height="135" rx="15"/>
      <rect x="516" y="623" width="247" height="135" rx="15"/>
      <rect x="831" y="623" width="233" height="135" rx="15"/>
    </g>
    <g fill="#526481" font-size="16" font-weight="700">
      <text x="207" y="659">01 · GitHub</text><text x="542" y="659">02 · 자동 검사</text><text x="857" y="659">03 · Google Cloud</text>
    </g>
    <g fill="#223b68" font-size="23" font-weight="700">
      <text x="207" y="702">코드 변경</text><text x="542" y="702">CI 결과</text><text x="857" y="702">배포 현황</text>
    </g>
    <g fill="#526481" font-size="16">
      <text x="207" y="733">PR과 커밋 확인</text><text x="542" y="733">워크플로 실행 확인</text><text x="857" y="733">Cloud Run 상태 확인</text>
    </g>
    <text x="160" y="820" font-size="15" fill="#526481">화면 구성 예시입니다. 실제 연결 상태를 표시하지 않습니다.</text>
