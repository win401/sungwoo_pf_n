<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">LINKSPACE 개발 현황 목업</title>
  <desc id="desc">가상 데이터로 구성한 개발 현황 연결 화면을 보여 주는 노트북 일러스트</desc>
  <defs>
    <linearGradient id="back" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#f0f6fa"/><stop offset="1" stop-color="#cbd8e9"/></linearGradient>
    <linearGradient id="metal" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#a4b2c5"/><stop offset=".42" stop-color="#e2eaf3"/><stop offset="1" stop-color="#7b8899"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.2" fill="#dce4f1"/></pattern>
  </defs>
  <rect width="1254" height="1254" rx="44" fill="#e6edf4"/>
  <rect width="1254" height="1254" rx="44" fill="url(#back)"/>
  <ellipse cx="627" cy="1014" rx="526" ry="38" fill="#5c7294" opacity=".22"/>
  <rect x="78" y="228" width="1098" height="726" rx="34" fill="#1c2740"/>
  <rect x="96" y="247" width="1062" height="682" rx="19" fill="#f7faff"/>
  <path d="M78 942h1098l62 39H16z" fill="url(#metal)"/>
  <path d="M16 981h1222q-11 21-55 23H71q-44-2-55-23z" fill="#94a4b8"/>
  <path d="M541 976h172q-6 13-21 13H562q-15 0-21-13" fill="#697c94"/>
